<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Check Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1340; --violet:#6C4DFF; --violet-d:#4B31D6; --pink:#FF5C93; --sun:#FFD23F;
  --mint:#2ED9A3; --sky:#4CC9FF; --paper:#F6F3FF; --white:#fff; --grey:#6B6785;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:18px;line-height:1.5;color:var(--ink);
  background:linear-gradient(160deg,#6C4DFF 0%,#4B31D6 100%);background-attachment:fixed;min-height:100vh}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0 0 .4em}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--sun)}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg svg{position:absolute;opacity:.13;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120vh) rotate(180deg)}}

/* HUD */
.hud{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding:10px 18px;background:var(--white);border-bottom:4px solid var(--ink)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap}
.track{flex:1 1 320px;display:flex;gap:8px;min-width:240px}
.seg{flex:1;font-size:12px;line-height:1.2;color:var(--grey)}
.seg .bar{height:12px;border:3px solid var(--ink);border-radius:8px;background:var(--paper);overflow:hidden;margin-bottom:3px}
.seg .bar i{display:block;height:100%;background:var(--mint);transition:width .6s}
.pills{display:flex;gap:8px}
.pill{border:3px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--sun);font-weight:700;white-space:nowrap}
.pill.fire{background:var(--pink)}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25) rotate(-4deg)}}

/* generic */
.stage{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:26px 18px 90px}
.card{background:var(--white);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:20px 22px}
.btn{display:inline-block;border:3px solid var(--ink);border-radius:14px;background:var(--sun);padding:8px 18px;font-weight:700;
  box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink)}
.btn.big{font-size:22px;padding:12px 26px;background:var(--mint)}
.btn.sm{padding:3px 12px;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:var(--white)}
.btn.pink{background:var(--pink)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;align-items:center}
.small{font-size:15px;color:var(--grey)}
.msg{color:#C2185B;font-weight:700;min-height:1.4em}
.chip{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-weight:700;font-size:15px}
.v-sup{background:var(--mint)} .v-not{background:var(--pink)} .v-nei{background:var(--sun)}

/* welcome */
.welcome{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;min-height:70vh}
.welcome h1{font-size:clamp(44px,7vw,78px);font-weight:800;letter-spacing:-.02em}
.lead{font-size:21px}
.howto{padding-left:1.3em;margin:0 0 16px}
.howto li{margin-bottom:6px}
.fields{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px}
.fields label{display:flex;flex-direction:column;font-weight:700;font-size:15px}
.fields input,.fields select{font:inherit;border:3px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--paper);min-width:150px}
.hero{position:relative;height:420px}
.hero-post{position:absolute;left:50%;top:50%;width:min(100%,420px);margin:-130px 0 0 -210px;background:var(--white);
  border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:20px;
  animation:postCycle 18s infinite both}
.hero-post:nth-child(2){animation-delay:6s}.hero-post:nth-child(3){animation-delay:12s}
.hero-post .claim{font-size:24px}
@keyframes postCycle{0%{opacity:0;transform:translateY(24px) rotate(-2deg)}2.5%{opacity:1;transform:none}31%{opacity:1;transform:none}33.3%,100%{opacity:0;transform:translateY(-16px)}}
.hero-post .stamp{animation:stampCycle 18s infinite both}
.hero-post:nth-child(2) .stamp{animation-delay:6s}.hero-post:nth-child(3) .stamp{animation-delay:12s}
@keyframes stampCycle{0%,9%{opacity:0;transform:translate(-50%,-50%) scale(3.2) rotate(-24deg)}
  12%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(-10deg)}
  14%{transform:translate(-50%,-50%) scale(1.04) rotate(-12deg)}
  16%,31%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}
  33.3%,100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}}

/* posts + stamps */
.avatar{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none}
.post-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.post-head b{display:block;line-height:1.1}.post-head span{font-size:14px;color:var(--grey)}
.post{position:relative}
.post .claim{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2;margin-bottom:10px}
.post .ctx{background:var(--paper);border-left:6px solid var(--violet);border-radius:0 12px 12px 0;padding:8px 12px;font-size:16px;margin:0}
.post .ctx ul{margin:6px 0 0;padding-left:1.1em}
.post-foot{display:flex;gap:16px;margin-top:12px;font-size:15px;color:var(--grey)}
.post.thud{animation:thud .45s}
@keyframes thud{20%{transform:translate(4px,6px) rotate(.6deg)}45%{transform:translate(-4px,-3px)}70%{transform:translate(2px,1px)}}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);z-index:3;pointer-events:none;
  border:6px double var(--ink);border-radius:14px;padding:6px 18px;font-family:var(--display);font-weight:800;font-size:30px;
  text-transform:uppercase;text-align:center;line-height:1.05;white-space:nowrap;box-shadow:0 0 0 4px rgba(255,255,255,.7)}
.stamp.big{animation:slam .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) scale(3.2) rotate(-26deg)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(-10deg)}
  75%{transform:translate(-50%,-50%) scale(1.05) rotate(-12deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}}

/* coach mascot */
.coach{display:flex;gap:12px;align-items:flex-end;margin:0 0 16px}
.mascot{width:68px;flex:none}
.m-bob{animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px) rotate(2deg)}}
.bubble{position:relative;background:var(--sun);border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:17px;box-shadow:4px 4px 0 var(--ink)}
.bubble p:last-child{margin:0}

/* round layout */
.round{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:start}
.round .left{position:sticky;top:96px}
.stepper{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 14px;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:1px 12px 1px 3px;opacity:.55}
.stepper li span{width:24px;height:24px;border-radius:50%;background:var(--white);border:2px solid var(--ink);display:grid;place-items:center;font-size:13px}
.stepper li.now{opacity:1;background:var(--sun)}
.stepper li.done{opacity:1;background:var(--mint)}
.step h3{font-size:28px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.stampbtn{border:3px solid var(--ink);border-radius:16px;padding:12px 10px;text-align:center;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .1s}
.stampbtn b{font-family:var(--display);font-size:20px;line-height:1.1}
.stampbtn small{font-size:14px;line-height:1.3}
.stampbtn .sicon{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--white);display:grid;place-items:center;font-weight:800;font-size:20px}
.stampbtn:hover{transform:translateY(-3px) rotate(-1deg)}
.stampbtn.on{transform:translate(3px,3px) rotate(-2deg);box-shadow:1px 1px 0 var(--ink);outline:4px solid var(--ink);outline-offset:3px}
.evgrid{display:grid;gap:10px;margin-top:10px}
.ev{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,background .15s}
.ev .ltr{width:30px;height:30px;border-radius:8px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;background:var(--paper);flex:none;font-family:var(--display)}
.ev:hover:not(.dim){transform:translateX(4px)}
.ev.on{background:#E3DCFF;transform:translate(3px,3px);box-shadow:none}
.ev.on .ltr{background:var(--violet);color:#fff}
.ev.dim{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.ev.result{cursor:default}
.tag{display:inline-block;font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin-right:6px}
.t2{background:var(--mint)}.t1{background:var(--sun)}.t0{background:#E5E2F2}
.picked{background:var(--violet);color:#fff;border-color:var(--ink)}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
.opt:hover:not(.dim):not(:disabled){transform:translateX(4px)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);flex:none;margin-top:2px;background:var(--white)}
.opt.on{background:#E3DCFF}.opt.on .dot{background:var(--violet)}
.opt.dim{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opt.right{background:#C8F5E6}.opt.right .dot{background:var(--mint)}
.opt.wrong{background:#FFD4E2;animation:shake .4s}.opt.wrong .dot{background:var(--pink)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{margin-top:12px;border-radius:14px;border:3px solid var(--ink);padding:10px 14px;font-size:17px}
.fb.good{background:#C8F5E6}.fb.bad{background:#FFD4E2}
.result h3{font-size:30px}
.result h4{font-size:19px;margin:16px 0 6px}
.rv{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:8px}
.explain{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px 14px}
.ptable{width:100%;border-collapse:collapse;margin-top:6px;font-size:16px}
.ptable td{padding:4px 6px;border-bottom:2px dashed #cfc9ea}.ptable td:last-child{text-align:right;font-weight:700}
.ptable tr.tot td{border-bottom:none;border-top:3px solid var(--ink);font-family:var(--display);font-size:22px}
.neg{color:#C2185B}

/* tools */
.tool{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.tool h2{color:#fff;font-size:34px;grid-column:1/-1;margin:0}
.tool-visual{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden}
.vialwrap{position:relative;width:170px}
.vial{width:170px;display:block}
.vial .bub{animation:rise 3s infinite ease-in}
.vial .bub:nth-child(2){animation-delay:.8s}.vial .bub:nth-child(3){animation-delay:1.6s}.vial .bub:nth-child(4){animation-delay:2.2s}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-80px);opacity:0}}
.beam{position:absolute;left:-30px;right:-30px;top:10px;height:10px;border-radius:6px;background:var(--sky);box-shadow:0 0 18px 6px var(--sky);opacity:0}
.scanning .beam{animation:scan 1.4s ease-in-out}
@keyframes scan{0%{opacity:1;top:14px}50%{opacity:1;top:210px}100%{opacity:0;top:14px}}
.readout{min-height:84px;display:flex;gap:14px;justify-content:center;align-items:flex-start;width:100%;border:3px dashed var(--ink);border-radius:16px;padding:10px;background:var(--paper)}
.readout .wait{color:var(--grey);align-self:center}
.atomwrap{text-align:center;font-size:13px;font-weight:700}
.atom{width:50px;height:50px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;animation:popin .5s cubic-bezier(.2,1.6,.4,1) both;margin:0 auto 2px}
@keyframes popin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.a-C{background:#3B3B58}.a-H{background:#fff;color:var(--ink)}.a-O{background:#FF4D4D}.a-N{background:#4C7DFF}.a-P{background:#FF9F1C}
.train{display:flex;gap:8px;width:100%;overflow-x:auto;padding:6px 4px 10px;animation:chug 1.6s ease-in-out infinite alternate}
@keyframes chug{to{transform:translateX(5px)}}
.car{flex:1;min-width:100px;border:3px solid var(--ink);border-radius:12px;background:var(--white);padding:6px 6px 14px;text-align:center;font-size:13px;font-weight:700;position:relative;transition:opacity .4s,background .4s}
.car::after{content:"";position:absolute;bottom:-9px;left:14px;width:18px;height:18px;border-radius:50%;background:var(--ink);box-shadow:50px 0 0 var(--ink)}
.car .d{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.car .d i{font-style:normal;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);font-size:11px;display:grid;place-items:center;color:#fff}
.car .d i.a-H{color:var(--ink)}
.car.match{background:#C8F5E6;animation:pulse .9s 3}
.car.dim{opacity:.35}
@keyframes pulse{50%{transform:scale(1.07)}}
.lens{width:300px;height:300px;max-width:100%;border-radius:50%;border:8px solid var(--ink);background:radial-gradient(circle,#fff 0,#E3F7FF 100%);position:relative;overflow:hidden;box-shadow:inset 0 0 30px rgba(76,201,255,.5)}
.lens svg{position:absolute;inset:0;width:100%;height:100%}
.lens .drop0{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50% 50% 50% 8%;transform:rotate(-45deg);background:#FFB020;border:4px solid var(--ink)}
.lens.zoomed .drop0{display:none}
.mol{opacity:0}.zoomed .mol{animation:zoomin 1s cubic-bezier(.2,1.2,.4,1) both}
@keyframes zoomin{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:none}}
.mol .tail{animation:wig 1.6s ease-in-out infinite alternate}
.mol .tail:nth-of-type(2){animation-delay:.3s}.mol .tail:nth-of-type(3){animation-delay:.6s}
@keyframes wig{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.mol .lbl{opacity:0}.zoomed .mol .lbl{animation:fadein .6s 1.1s forwards}
@keyframes fadein{to{opacity:1}}
.t-ink{fill:var(--ink);font:700 15px var(--body)}
.wsvg{width:100%;max-width:380px}
.wave{animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(-160px)}}
.drop{opacity:0}.dropping .drop{animation:fall 1s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0)}85%{opacity:1;transform:translateY(74px)}100%{opacity:0;transform:translateY(80px)}}
.bead{opacity:0;transform-origin:180px 114px}
.beaded .bead{opacity:1;animation:beadpop .6s cubic-bezier(.2,1.6,.4,1),beadbob 2.4s 0.6s ease-in-out infinite alternate}
@keyframes beadpop{from{transform:scale(0)}to{transform:none}}
@keyframes beadbob{to{transform:translateY(-3px)}}
.beaded.stirring .bead{opacity:0;animation:none}
.mini{opacity:0;transition:transform 1s cubic-bezier(.4,0,.2,1),opacity .2s}
.stirring .mini{opacity:1}
.qcard{margin-top:16px}
.fade-in{animation:fadein .5s both;opacity:0}

/* membrane */
.mem{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start}
.mem h2{grid-column:1/-1;color:#fff;font-size:34px;margin:0}
.mem-visual{padding:10px}
#memsvg{width:100%;display:block;border-radius:14px;border:3px solid var(--ink);background:#BFE9FF}
.mol2{transition:transform 1.7s cubic-bezier(.45,.05,.25,1)}
.mol2.nt{transition:none}
.bob{animation:bob2 2s ease-in-out infinite alternate}
@keyframes bob2{to{transform:translateY(5px)}}

/* notes drawer */
#notesBtn{position:fixed;right:18px;bottom:18px;z-index:30;font-size:19px;padding:10px 20px;background:var(--pink)}
#notes{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);z-index:40;background:var(--white);border-left:4px solid var(--ink);
  transform:translateX(105%);transition:transform .35s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column}
#notes.open{transform:none}
#notes header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:4px solid var(--ink);background:var(--sun)}
#notes header h2{margin:0;font-size:26px}
.tabs{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;border-bottom:3px solid var(--ink)}
.tabs button{border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 14px;font-weight:700;font-size:15px}
.tabs button.on{background:var(--violet);color:#fff}
.ntab{padding:14px 16px;overflow:auto;flex:1}
.ngrp{border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.ngrp h3{font-size:21px;margin-bottom:4px}
.ngrp dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:2px 8px;font-size:16px}
.ngrp dt{font-weight:700}.ngrp dd{margin:0}
.g-carb{background:#FFF1B8}.g-lip{background:#FFD4E2}.g-pro{background:#CFEFFF}.g-nuc{background:#D9F7E8}
.term{margin-bottom:10px;font-size:17px}.term b{font-family:var(--display)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(27,19,64,.6);z-index:60;display:grid;place-items:center;padding:18px}
.modal[hidden]{display:none}

/* case file */
.casefile{max-width:860px;margin:0 auto}
.cf-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.badge{width:120px;height:120px;flex:none}
.badge .burst{transform-origin:60px 60px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cf-top h2{font-size:42px;margin:0}
.cf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.cf-stats div{border:3px solid var(--ink);border-radius:14px;padding:8px 10px;text-align:center;background:var(--paper)}
.cf-stats b{display:block;font-family:var(--display);font-size:28px;line-height:1.1}
.cf-table{width:100%;border-collapse:collapse;font-size:16px}
.cf-table th,.cf-table td{border:2px solid var(--ink);padding:5px 8px;text-align:left;vertical-align:top}
.cf-table th{background:var(--sun)}
.ok{color:#0B8F66;font-weight:700}.no{color:#C2185B;font-weight:700}
#confetti{position:fixed;inset:0;z-index:50;pointer-events:none}


.replay-banner{margin-bottom:20px;background:var(--sun)}
.meter{position:relative;height:22px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--mint);border-radius:8px 0 0 8px;transition:width .8s}
.meter b{position:absolute;top:-8px;bottom:-8px;width:4px;background:var(--ink);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chipbtn{border:3px solid var(--ink);border-radius:999px;background:var(--white);padding:2px 14px;font-weight:700;font-size:16px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.chipbtn:hover{transform:translateY(-2px)}
.chipbtn.on{background:var(--violet);color:#fff;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tlabel{display:block;font-weight:700;margin:4px 0}

<script>
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='claimCheckLab_v1';
const fresh=()=>({name:'',hour:'',step:0,score:0,streak:0,bestStreak:0,hints:0,results:[],finals:null,attempt:1,rp:null,masteredOn:null,reflect:{}});
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||fresh();

/* ============ content ============ */
const VERD={
  supported:{label:'Supported',cls:'v-sup',icon:'✔',desc:'The evidence backs up the claim.'},
  not:{label:'Not supported',cls:'v-not',icon:'✖',desc:'The evidence shows the claim is wrong.'},
  nei:{label:'Not enough evidence',cls:'v-nei',icon:'?',desc:'The clues can’t decide yet. We need more.'}
};
const CARS=[{n:'Carbs',e:['C','H','O']},{n:'Lipids',e:['C','H','O']},{n:'Proteins',e:['C','H','O','N']},{n:'Nucleic acids',e:['C','H','O','N','P']}];

const ROUNDS={
 train:{training:true,title:'Practice',handle:'@lab_newbie',verdict:'not',
  claim:'Sample P is a carbohydrate. It has C, H, and O.',
  ctx:'<b>Your lab report on Sample P:</b><ul><li>Scanner: C, H, and O</li><li>Block Viewer: one glycerol + three fatty acid tails</li><li>Water test: stays in a bead</li><li>Function log: stores energy</li></ul>',
  evidence:[
   {t:'Scanner: Sample P has C, H, and O.',q:1,why:'True. But carbs and lipids both have C, H, and O. This clue can’t tell them apart.'},
   {t:'Block Viewer: one glycerol with three fatty acid tails.',q:2,why:'Strong. Carbs are built from sugar units. This is the shape of a fat.'},
   {t:'Notes: carbs are chains of sugar units. Fats are glycerol plus fatty acids.',q:2,why:'Strong. This rule lets you compare the sample to a carb.'},
   {t:'Water test: Sample P does not mix with water.',q:1,why:'Helpful. It fits fats. But one clue alone is not enough.'},
   {t:'The sample was in a blue tube.',q:0,why:'This has nothing to do with biomolecules.'}],
  reasons:[
   {t:'The blocks are glycerol and fatty acids, not sugar units. So Sample P is a lipid, not a carb.',ok:1},
   {t:'It has C, H, and O, so it must be a carb.'},
   {t:'It stores energy, so only a carb can be it.'},
   {t:'It stayed in a bead, so it has no building blocks.'}],
  explain:'The C, H, and O clue fits two groups. The building blocks decide it. Sample P is a fat, which is a lipid.',
  hints:{verdict:'Check the block clue. Does it match sugar units?'},
  coach:{verdict:'Read the claim. Then check your lab report. Pick your first stamp.',evidence:'Pick the 2 clues that connect most to the claim. A true fact can still be a weak clue.',reason:'Pick the sentence that uses your best clue.'}},

 r1:{title:'Sample D',handle:'@sample_d',verdict:'nei',
  claim:'Sample D has C, H, and O. It must be a carbohydrate.',
  ctx:'<b>Lab report:</b> Sample D has carbon, hydrogen, and oxygen. That is all we know.',
  evidence:[
   {t:'Carbs and many lipids both have C, H, and O.',q:2,why:'Strong. Two groups share the same elements.'},
   {t:'The report gives no clue about the building blocks.',q:2,why:'Strong. Building blocks would help us decide.'},
   {t:'Sample D has C, H, and O.',q:1,why:'True, and it fits carbs. But it fits lipids too.'},
   {t:'Sugars are carbohydrates.',q:0,why:'True, but we don’t know if Sample D is a sugar.'},
   {t:'Proteins have nitrogen.',q:0,why:'True, but it is not about Sample D.'}],
  reasons:[
   {t:'Carbs and lipids both have C, H, and O. The elements alone can’t decide.',ok:1},
   {t:'Sample D has C, H, and O, so it is a carb.'},
   {t:'Sample D has no nitrogen, so it is a protein.'},
   {t:'Anything with oxygen is a lipid.'}],
  next:[
   {t:'Look at the building blocks. Are they sugar units, or glycerol and fatty acids?',ok:1},
   {t:'Weigh the sample.'},
   {t:'Check the color of the tube.'},
   {t:'Count how many people posted the claim.'}],
  explain:'Two groups share the same elements. You need a second clue, like the building blocks or the job.',
  hints:{verdict:'Count the clues. Is one clue enough?'}},

 r2:{title:'Starch and cellulose',handle:'@plant_pal',verdict:'supported',
  claim:'Starch and cellulose are both carbs. But they do different jobs.',
  ctx:'Starch is found in potatoes. Cellulose is found in celery.',
  evidence:[
   {t:'Starch stores energy in plants. Cellulose gives plant cell walls their structure.',q:2,why:'Strong. This shows two different jobs.'},
   {t:'Both are long chains of sugar units.',q:2,why:'Strong. This shows both are carbs.'},
   {t:'Both have C, H, and O.',q:1,why:'True. But it doesn’t show different jobs. Lipids have C, H, and O too.'},
   {t:'Glycogen is stored in the liver.',q:0,why:'True, but glycogen is not in this claim.'},
   {t:'Pasta is a food with carbs.',q:0,why:'True, but it says nothing about cellulose.'}],
  reasons:[
   {t:'Both are sugar chains, so both are carbs. One stores energy. One gives structure.',ok:1},
   {t:'They are both carbs, so they must do the same job.'},
   {t:'They do different jobs, so one must be a lipid.'},
   {t:'Only starch is a carb because it stores energy.'}],
  explain:'Same group does not mean same job. The sugar units are joined in different ways, so the jobs are different.',
  hints:{verdict:'Does the claim have two parts? Check both.'}},

 r3:{title:'Lion’s needs',handle:'@gym_lion',verdict:'not',
  claim:'Lions only need carbs. Energy can do every job.',
  ctx:'A lion needs: energy to run, stored energy and insulation, and muscle repair.',
  evidence:[
   {t:'Muscle is built from proteins. Proteins are chains of amino acids.',q:2,why:'Strong. Muscle needs building blocks, not just energy.'},
   {t:'Fats store energy and help insulate the body.',q:2,why:'Strong. Carbs are not the group for insulation.'},
   {t:'Carbs give quick energy.',q:1,why:'True. But it covers only one of the three needs.'},
   {t:'Lions eat meat.',q:0,why:'True, but it doesn’t test the claim.'},
   {t:'Lions are fast runners.',q:0,why:'True, but it doesn’t help.'}],
  reasons:[
   {t:'Carbs give energy. But muscle needs proteins and insulation needs lipids. Energy is not a building material.',ok:1},
   {t:'Carbs can’t give energy.'},
   {t:'Energy can build muscle all by itself.'},
   {t:'Lions only need protein.'}],
  explain:'Energy and building materials are different things. Cells need both.',
  hints:{verdict:'List the three needs. Can carbs meet all three?'}},

 r4:{title:'Nuts',handle:'@trailmix_tina',verdict:'not',
  claim:'Nuts are pure protein. That’s why hikers pack them.',
  ctx:'Nuts are in lots of trail mixes.',
  evidence:[
   {t:'Nuts also contain lipids (fats and oils).',q:2,why:'Strong. “Pure protein” can’t be true if lipids are there.'},
   {t:'One food can have more than one biomolecule group.',q:2,why:'Strong. Foods are mixes.'},
   {t:'Lipids store lots of energy. That helps on long hikes.',q:1,why:'Helpful for the “why,” but it doesn’t test “pure protein.”'},
   {t:'Proteins are made of amino acids.',q:0,why:'True, but it doesn’t show what else is in nuts.'},
   {t:'Nuts grow on trees.',q:0,why:'True, but it doesn’t help.'}],
  reasons:[
   {t:'Nuts have protein and lipids, so “pure protein” is wrong.',ok:1},
   {t:'Anything with protein has no other biomolecules.'},
   {t:'Nuts are pure lipid, with no protein.'},
   {t:'Hikers only need energy, so protein doesn’t matter.'}],
  explain:'Nuts have protein and lipids. The lipids give lots of energy. The protein helps build and repair. That is why hikers like them.',
  hints:{verdict:'Look at the word “pure.” What would break it?'}},

 r5:{title:'DNA',handle:'@dna_dave',verdict:'not',
  claim:'DNA is a protein. It has nitrogen.',
  ctx:'Proteins and nucleic acids both have nitrogen.',
  evidence:[
   {t:'DNA is built from nucleotides, not amino acids.',q:2,why:'Strong. Proteins are built from amino acids.'},
   {t:'Nucleic acids also have phosphorus (P). Proteins usually don’t.',q:2,why:'Strong. P is a clue for nucleic acids.'},
   {t:'DNA has nitrogen.',q:1,why:'True. But nucleic acids have nitrogen too. It can’t decide.'},
   {t:'DNA is double stranded.',q:0,why:'True, but it doesn’t tell us the group.'},
   {t:'RNA is single stranded.',q:0,why:'True, but it’s about RNA.'}],
  reasons:[
   {t:'Both have nitrogen. But DNA is made of nucleotides and has phosphorus. It is a nucleic acid.',ok:1},
   {t:'Only proteins have nitrogen, so DNA must be a protein.'},
   {t:'DNA has a sugar in its nucleotides, so it is a carb.'},
   {t:'DNA has no nitrogen.'}],
  explain:'One matching clue is not enough. The building blocks and the phosphorus show DNA is a nucleic acid.',
  hints:{verdict:'Does nitrogen belong to only one group?'}},

 r6:{title:'Sample M',handle:'@chain_gang',verdict:'nei',
  claim:'Sample M is a protein. It is made of long chains.',
  ctx:'<b>Lab report:</b> Sample M is made of long chains. No other facts.',
  evidence:[
   {t:'Carbs, proteins, and nucleic acids can all be long chains.',q:2,why:'Strong. Chains don’t point to one group.'},
   {t:'The report doesn’t say what the units are.',q:2,why:'Strong. The units would tell us the group.'},
   {t:'Amino acids join into chains.',q:1,why:'True. But we don’t know Sample M’s units.'},
   {t:'Proteins do many jobs.',q:0,why:'True, but it doesn’t help here.'},
   {t:'Polypeptides fold into shapes.',q:0,why:'True, but we don’t know if Sample M is one.'}],
  reasons:[
   {t:'Three groups can be chains. We need the units or the elements.',ok:1},
   {t:'Long chains mean it is a protein.'},
   {t:'Only proteins are chains.'},
   {t:'Long chains mean it is a lipid.'}],
  next:[
   {t:'Check the building blocks (amino acids?) and look for nitrogen (N).',ok:1},
   {t:'Measure how long one chain is.'},
   {t:'Check if the sample floats.'},
   {t:'Ask which food it came from, and trust the answer.'}],
  explain:'Many groups can be chains. We need the units or the elements before we can stamp it.',
  hints:{verdict:'Which groups can be chains? Is it just one?'}},

 r7:{title:'Phospholipids',handle:'@membrane_mike',verdict:'supported',
  claim:'A phospholipid has a head that likes water. It has tails that avoid water.',
  ctx:'Think about cell membranes.',
  evidence:[
   {t:'The head has a phosphate group. It is hydrophilic.',q:2,why:'Strong. This supports the “head likes water” part.'},
   {t:'The two fatty acid tails are hydrophobic.',q:2,why:'Strong. This supports the “tails avoid water” part.'},
   {t:'Phospholipids have glycerol.',q:1,why:'True. But it says nothing about water.'},
   {t:'Fats have three fatty acid tails.',q:0,why:'True, but that is a fat, not a phospholipid.'},
   {t:'Cells have membranes.',q:0,why:'True, but it doesn’t test the claim.'}],
  reasons:[
   {t:'The phosphate head is hydrophilic. The fatty acid tails are hydrophobic. The claim matches.',ok:1},
   {t:'Both parts are hydrophobic.'},
   {t:'Both parts like water.'},
   {t:'The tails have phosphate, so they like water.'}],
  explain:'A phospholipid has two parts. The head likes water. The tails avoid it. That is why it can build a membrane.',
  hints:{verdict:'Does the claim have two parts? Is each part true?'}},

 boss:{title:'Membrane boss',handle:'@cell_designer',verdict:'not',
  claim:'A fat (triglyceride) would make a great cell membrane. Water is on both sides.',
  ctx:'You just tested Molecule X (a fat) and Molecule Y (a phospholipid) in the Membrane Lab.',
  evidence:[
   {t:'Lab test: the fats clumped into a blob. They did not make two layers.',q:2,why:'Strong. You saw it happen.'},
   {t:'Lab test: phospholipids made two layers. Heads faced the water. Tails hid inside.',q:2,why:'Strong. That is how a membrane works.'},
   {t:'Fats and phospholipids are both lipids.',q:1,why:'True. But the same group doesn’t mean the same job.'},
   {t:'Fats store energy.',q:0,why:'True, but a membrane is a different job.'},
   {t:'Fats have glycerol.',q:0,why:'True. So do phospholipids. It can’t decide.'}],
  reasons:[
   {t:'A fat has no water-loving head, so it can’t face water on both sides. A phospholipid can.',ok:1},
   {t:'A fat has a hydrophilic head, so it works best.'},
   {t:'Phospholipids clump into a blob, so they are bad.'},
   {t:'Membranes never touch water, so any lipid works.'}],
  explain:'A fat has only hydrophobic tails. A phospholipid has a hydrophilic head and hydrophobic tails. That lets it face water on both sides.',
  hints:{verdict:'Which molecule has a part that likes water?'}}
};
const FEED=['r1','r2','r3','r4','r5','r6','r7'];
const FLOW=[{t:'welcome'},{t:'tool',id:'scanner'},{t:'tool',id:'blocks'},{t:'tool',id:'water'},{t:'round',id:'train'}]
  .concat(FEED.map(id=>({t:'round',id:id})))
  .concat([{t:'membrane'},{t:'round',id:'boss'},{t:'final'},{t:'gate'},{t:'reflect'},{t:'case'}]);
const IDX={};FLOW.forEach((s,i)=>{if(['final','gate','reflect','case'].includes(s.t))IDX[s.t]=i});
const SEG=[['Training',1,4],['Fact-Check Feed',5,11],['Boss Level',12,13],['Check & Reflect',14,16],['Case File',17,18]];

const FINAL_Q=[
 {q:'The clues are not enough to decide. What should a good scientist do?',o:['Pick the most likely answer and move on.','Say “not enough evidence” and name a test to run.','Ask a friend what they think.','Change the claim to match the clues.'],c:1,why:'Say what you can’t tell yet, and name the test that would help.'},
 {q:'Which element is in nucleic acids but NOT in proteins?',o:['Carbon (C)','Nitrogen (N)','Phosphorus (P)','Oxygen (O)'],c:2,why:'Nucleic acids have phosphorus (CHONP). Proteins are CHON.'},
 {q:'True or false: Two molecules in the same group always do the same job.',o:['True','False'],c:1,why:'False. Starch and cellulose are both carbs, but their jobs differ.'}
];
function maxPoints(){let m=0;FEED.concat(['boss']).forEach(id=>{m+=ROUNDS[id].next?50:40});return m+FINAL_Q.length*5}
const NEED_STAMPS=6,NEED_PCT=0.8;
const needPts=()=>Math.ceil(NEED_PCT*maxPoints());
const baseTotal=()=>S.results.reduce((a,r)=>a+r.base,0)+(S.finals?S.finals.pts:0);
const stampsOk=()=>S.results.filter(r=>r.mine===r.official).length;
const mastered=()=>baseTotal()>=needPts()&&stampsOk()>=NEED_STAMPS;
const recalc=()=>{S.score=S.results.reduce((a,r)=>a+r.pts,0)+(S.finals?S.finals.pts:0)};
function buildQueue(){
  const list=S.results.map(r=>{const mx=ROUNDS[r.id].next?50:40;return {id:r.id,pct:r.base/mx,vOk:r.mine===r.official}});
  let q=list.filter(x=>!x.vOk||x.pct<.9);
  if(!q.length)q=list.slice().sort((a,b)=>a.pct-b.pct).slice(0,3);
  q=q.sort((a,b)=>(a.vOk-b.vOk)||(a.pct-b.pct)).slice(0,5);
  const ids=q.map(x=>x.id);
  return S.results.map(r=>r.id).filter(id=>ids.includes(id));
}

/* ============ notes ============ */
const NOTES={
 groups:`
 <div class="ngrp g-carb"><h3>Carbohydrates</h3><dl><dt>Elements</dt><dd>C, H, O</dd><dt>Blocks</dt><dd>Sugar units (monosaccharides)</dd><dt>Jobs</dt><dd>Energy, energy storage, structure</dd><dt>Examples</dt><dd>Glucose, sucrose, starch, cellulose</dd></dl></div>
 <div class="ngrp g-lip"><h3>Lipids</h3><dl><dt>Elements</dt><dd>C, H, O</dd><dt>Parts</dt><dd>Glycerol + fatty acids. A fat has 1 glycerol and 3 tails. A phospholipid has a phosphate head and 2 tails.</dd><dt>Jobs</dt><dd>Energy storage, insulation, cell membranes</dd><dt>Water</dt><dd>Fatty acid tails avoid water. A phospholipid head likes water.</dd><dt>Note</dt><dd>Lipids are not true chains of repeating units.</dd></dl></div>
 <div class="ngrp g-pro"><h3>Proteins</h3><dl><dt>Elements</dt><dd>C, H, O, N (some have S)</dd><dt>Blocks</dt><dd>Amino acids. They join into polypeptides that fold.</dd><dt>Jobs</dt><dd>Build and repair, enzymes, transport, muscle</dd><dt>Examples</dt><dd>Insulin, keratin, hemoglobin</dd></dl></div>
 <div class="ngrp g-nuc"><h3>Nucleic acids</h3><dl><dt>Elements</dt><dd>C, H, O, N, P</dd><dt>Blocks</dt><dd>Nucleotides: a sugar, a phosphate, and a base</dd><dt>Jobs</dt><dd>DNA stores instructions. RNA helps make proteins.</dd></dl></div>
 <p class="small">Clue train: CHO, CHO, CHON, CHONP!</p>`,
 terms:`
 <div class="term"><b>Monomer:</b> one small building block.</div>
 <div class="term"><b>Polymer:</b> a chain of many monomers.</div>
 <div class="term"><b>Hydrophilic:</b> “water-loving.” It mixes with water.</div>
 <div class="term"><b>Hydrophobic:</b> “water-avoiding.” It doesn’t mix with water.</div>
 <div class="term"><b>Insulation:</b> keeps heat from leaving the body.</div>
 <div class="term"><b>Claim:</b> a statement we can check with evidence.</div>
 <div class="term"><b>Evidence:</b> facts that back up or break a claim.</div>
 <div class="term"><b>Reasoning:</b> explains how the evidence connects to the claim.</div>
 <div class="term"><b>Strong clue:</b> a fact that connects straight to the claim.</div>`,
 stamps:`
 <div class="ngrp g-carb" style="background:#C8F5E6"><h3>✔ Supported</h3><p>The evidence backs up the claim. Every part of it holds up.</p></div>
 <div class="ngrp" style="background:#FFD4E2"><h3>✖ Not supported</h3><p>The evidence shows part of the claim is wrong.</p></div>
 <div class="ngrp" style="background:#FFF1B8"><h3>? Not enough evidence</h3><p>The clues fit more than one answer. Say what is missing. Name a test.</p></div>
 <p><b>Tip:</b> A true fact is not always a strong clue. Ask: “Does this fact connect to the claim?”</p>`
};

/* ============ background ============ */
function buildBg(){
  if(RM)return;

function hud(){

    const len=b-a+1;let f=st.t==='case'?1:Math.max(0,Math.min(1,(S.step-a)/len));

let shownScore=0;
function setScore(n){
  const el=$('#score');
  if(RM){el.textContent=n;shownScore=n;return}
  const from=shownScore,t0=performance.now();
  const tick=t=>{const p=Math.min(1,(t-t0)/700);shownScore=Math.round(from+(n-from)*p);el.textContent=shownScore;if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
  const pill=$('#scorePill');pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump');
}

let RT=null,TS={},MS={};
function render(){
  hud();

  else if(st.t==='membrane'){MS={tried:{x:false,y:false},solved:false};html=viewMembrane()}

  if(st.t==='membrane')initMembrane();
  if(st.t==='case'||(st.t==='gate'&&mastered()))celebrate();
  setScore(S.score);
}

function doHint(){
  const R=RT.R,ph=RT.phase;
  if(RT.hinted[ph])return;
  RT.hinted[ph]=true;
  if(!R.training){RT.hints++}
  if(ph==='verdict'){RT.say=esc(R.hints.verdict)}
  else if(ph==='evidence'){
    const c=R.evidence.map((e,i)=>i).filter(i=>R.evidence[i].q===0&&!RT.ev.includes(i));
    if(c.length){RT.dim[c[0]]=true}
    RT.say='I crossed out one clue that doesn’t help.';
  }else if(ph==='reason'||ph==='next'){
    const isR=ph==='reason',list=isR?R.reasons:R.next;
    const c=list.map((e,i)=>i).filter(i=>!list[i].ok&&(isR?RT.reason:RT.next)!==i);
    if(c.length){RT.dim[(isR?'r':'n')+c[0]]=true}
    RT.say='I crossed out one answer that doesn’t fit.';
  }
  renderPanel();
}
function setPhase(p){RT.phase=p;RT.say='';renderPanel();const pn=$('#panel');if(pn&&window.innerWidth<860)pn.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}

function finishRound(){
  const R=RT.R;
  const vOk=RT.verdict===R.verdict;
  const evPts=RT.ev.reduce((a,i)=>a+R.evidence[i].q*5,0);
  const rOk=!!R.reasons[RT.reason].ok;
  const nOk=R.next?!!R.next[RT.next].ok:null;
  let streakBonus=0,delta=0,clean=false;
  if(!R.training){
    clean=vOk&&evPts===20;
    if(clean){S.streak++;if(S.streak>S.bestStreak)S.bestStreak=S.streak;if(S.streak>=2)streakBonus=Math.min(15,5*(S.streak-1))}
    else S.streak=0;
    const base=Math.max(0,(vOk?10:0)+evPts+(rOk?10:0)+(nOk?10:0)-3*RT.hints);
    delta=base+streakBonus;S.hints+=RT.hints;
    const entry={id:RT.id,title:R.title,mine:RT.verdict,official:R.verdict,evPts,rOk,nOk,base,pts:delta,hints:RT.hints,attempt:S.attempt};
    const k=S.results.findIndex(x=>x.id===RT.id);
    if(k<0)S.results.push(entry);else if(base>=S.results[k].base)S.results[k]=entry;
    recalc();
  }
  RT.res={vOk,evPts,rOk,nOk,streakBonus,delta,clean};
  if(S.rp){S.rp.i++;if(S.rp.i>=S.rp.q.length){S.rp=null;S.step=(S.finals&&S.finals.pts<10)?IDX.final:IDX.gate}}
  else S.step++;
  save();
  RT.phase='result';RT.say='';
  renderPanel();hud();setScore(S.score);
  if(clean){const p=$('#streakPill');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump')}
  const slot=$('#stampslot');
  slot.innerHTML=`<div class="stamp big ${VERD[R.verdict].cls}">${VERD[R.verdict].label}</div>`;
  setTimeout(()=>{const po=$('#post');if(po)po.classList.add('thud')},RM?0:420);
}

function memTest(m){

function celebrate(){

  const cv=$('#confetti'),cx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#FF5C93','#FFD23F','#2ED9A3','#4CC9FF','#fff'];
  const ps=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,r:Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));
  const t0=performance.now();
  (function f(t){
    cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});
    if(t-t0<3800)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height);

/* ============ events ============ */
$('#stage').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,d=b.dataset;
  switch(a){
    case 'start':{
      const n=$('#fName').value.trim(),h=$('#fHour').value;
      if(!n||!h){$('#formMsg').textContent=!n?'Type your name to start.':'Pick your hour to start.';return}
      S.name=n;S.hour=h;S.step=1;save();render();break}
    case 'toolAct':toolAct(d.tool);break;
    case 'toolAns':toolAns(+d.i);break;
    case 'toolNext':S.step++;save();render();break;
    case 'pickVerdict':RT.verdict=d.v;renderPanel();break;
    case 'lockVerdict':if(RT.verdict)setPhase('evidence');break;
    case 'toggleEv':{const i=+d.i,k=RT.ev.indexOf(i);if(k>=0)RT.ev.splice(k,1);else if(RT.ev.length<2)RT.ev.push(i);renderPanel();break}
    case 'lockEv':if(RT.ev.length===2)setPhase('reason');break;
    case 'pickReason':RT.reason=+d.i;renderPanel();break;
    case 'lockReason':if(RT.reason===null)return;if(RT.R.next)setPhase('next');else finishRound();break;
    case 'pickNext':RT.next=+d.i;renderPanel();break;
    case 'lockNext':if(RT.next!==null)finishRound();break;
    case 'hint':doHint();break;
    case 'nextStep':render();break;
    case 'memTest':memTest(d.m);break;
    case 'memAns':memAns(+d.i);break;
    case 'finalPick':finalPick(+d.q,+d.i);break;
    case 'finalCheck':finalCheck();break;
    case 'print':window.print();break;
    case 'copy':{
      const txt=caseText(),msg=$('#copyMsg');
      const ok=()=>{msg.textContent='Copied! Paste it where your teacher asked you to turn it in.'};
      const bad=()=>{msg.textContent='Copy did not work. Please print or take a screenshot instead.'};
      try{navigator.clipboard.writeText(txt).then(ok,bad)}catch(err){bad()}
      break}
    case 'again':$('#modal').hidden=false;break;
    case 'retry':S.attempt++;S.rp={q:buildQueue(),i:0};RT=null;save();render();break;
    case 'toReflect':S.masteredOn=S.attempt;S.step=IDX.reflect;save();render();break;
    case 'rPick':{
      S.reflect[d.f]=d.v;save();
      document.querySelectorAll(`[data-act="rPick"][data-f="${d.f}"]`).forEach(x=>{const on=x.dataset.v===d.v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
      break}
    case 'rSubmit':{
      const m=reflectMissing();
      if(m.length){$('#rMsg').textContent='Almost done. Please '+m.join(', ')+'.';return}
      S.step=IDX.case;save();render();break}
    case 'editReflect':S.step=IDX.reflect;save();render();break;
  }
});

  if(open)setTab(document.querySelector('.tabs button.on').dataset.tab);
}
$('#notesBtn').addEventListener('click',()=>toggleNotes(!$('#notes').classList.contains('open')));
$('#notesClose').addEventListener('click',()=>toggleNotes(false));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){toggleNotes(false);$('#modal').hidden=true}});

/* restart */
$('#restartBtn').addEventListener('click',()=>{$('#modal').hidden=false});
$('#noRestart').addEventListener('click',()=>{$('#modal').hidden=true});
$('#yesRestart').addEventListener('click',()=>{
  $('#modal').hidden=true;S=fresh();save();RT=null;shownScore=0;render();
});

/* ============ go ============ */
buildBg();
if(S.step>=FLOW.length)S.step=FLOW.length-1;
render();
</script>
</body>
</html>
